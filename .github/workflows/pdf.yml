# Build the documentation PDF.
#
# The pages of the built site in `dist/` are merged into one document, in the order
# of the `sidebar` array in `astro.config.ts`, and handed to WeasyPrint. What it
# prints is the site's own print styling: the `@media print` rules in
# `src/custom.css`.
#
# The PDF is an artifact of the run and nothing else: it is written to the runner's
# temporary directory and uploaded for download, so a run never leaves a file in the
# checkout. WeasyPrint needs Pango together with its GLib/GObject dependencies, which
# the runner does not carry.

name: Build PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install Pango and fonts for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation

      - run: npm ci

      - run: npm run build

      - name: Merge the pages and render the PDF
        run: |
          uv run --no-project --with weasyprint --with lxml python .github/workflows/pdf.py --out "$RUNNER_TEMP/mongolian-utn.pdf"

      - uses: actions/upload-artifact@v7
        with:
          name: mongolian-utn-pdf
          path: ${{ runner.temp }}/mongolian-utn.pdf
          if-no-files-found: error
