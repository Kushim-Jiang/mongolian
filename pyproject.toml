# The repository is a uv workspace. Its Python project is the package in
# `mongfontbuilder/`, which is the only member; the root itself is not a package,
# and declares nothing but the workspace. The point of the workspace is the single
# environment and the single lockfile it gives the whole repository: the Python
# outside `mongfontbuilder/` — the template script, the documentation scripts, and
# the like — runs in the same environment as the package, without a second one.
#
# The tools of that environment are the development group of `mongfontbuilder/`,
# which a `uv sync` at the root installs together with the member itself.
[tool.uv.workspace]
members = ["mongfontbuilder"]

[tool.ruff]
# Treat the repository root, and the source and tests of the project, as first-party
# for sorting imports.
src = [".", "mongfontbuilder/src", "mongfontbuilder/tests"]
line-length = 100
lint.select = []

[tool.ruff.lint.isort]
known-local-folder = ["utils", "fixtures", "unified"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-report ndiff --color=yes"
